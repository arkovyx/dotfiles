source = $HOME/.cache/wal/colors-hyprland.conf

general {
    hide_cursor = true
    no_fade_in = false
    grace = 0
    disable_loading_bar = true
}

# ── GLASS BACKGROUND ─────────────────────────────────
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 7
    noise = 0.01
    brightness = 0.6
    contrast = 0.95
}

background {
    monitor =
    color = rgba(0, 0, 0, 0.35)
}

# ── TOP LEFT: day · date ─────────────────────────────
label {
    monitor =
    text = cmd[update:60000] date +'%a · %d %b' | tr a-z A-Z
    color = $color7
    font_size = 22
    font_family = lcd phone
    position = 40, -40
    halign = left
    valign = top
}

# ── TOP RIGHT: music (mpd), small display only ───────
label {
    monitor =
    text = cmd[update:2000] $HOME/.config/hypr/scripts/hl.py music
    color = $color7
    font_size = 14
    font_family = lcd phone
    text_align = right
    position = -40, -40
    halign = right
    valign = top
}

# ── CENTER ───────────────────────────────────────────
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $color7
    font_size = 120
    font_family = lcd phone
    position = 0, 100
    halign = center
    valign = center
}

label {
    monitor =
    text = Hello arkovyx
    color = $foreground
    font_size = 20
    font_family = KESORA
    position = 0, 0
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 230, 40
    outline_thickness = 1
    outer_color = rgba(255, 255, 255, 0.18)
    dots_size = 0.2
    dots_spacing = 0.4
    dots_center = true
    inner_color = rgba(255, 255, 255, 0.10)
    font_color = $color7
    fade_on_empty = false
    placeholder_text = <span foreground='white'><i>Escape the Matrix</i></span>
    fail_color = $color7
    hide_input = false
    position = 0, -50
    halign = center
    valign = center
}

# ── BOTTOM CENTER: dot rings (CPU · MEM · BAT) ───────
image {
    monitor =
    path = $HOME/.cache/hl-rings/ring_0.png
    reload_time = 3
    reload_cmd = $HOME/.config/hypr/scripts/ring.sh ring cpu
    size = 120
    border_size = 0
    position = -150, 68
    halign = center
    valign = bottom
}
image {
    monitor =
    path = $HOME/.cache/hl-rings/ring_0.png
    reload_time = 3
    reload_cmd = $HOME/.config/hypr/scripts/ring.sh ring mem
    size = 120
    border_size = 0
    position = 0, 68
    halign = center
    valign = bottom
}
image {
    monitor =
    path = $HOME/.cache/hl-rings/ring_0.png
    reload_time = 10
    reload_cmd = $HOME/.config/hypr/scripts/ring.sh ring bat
    size = 120
    border_size = 0
    position = 150, 68
    halign = center
    valign = bottom
}

# percentages inside the rings
label {
    monitor =
    text = cmd[update:3000] $HOME/.config/hypr/scripts/ring.sh pct cpu
    color = $color7
    font_size = 22
    font_family = lcd phone
    position = -150, 114
    halign = center
    valign = bottom
}
label {
    monitor =
    text = cmd[update:3000] $HOME/.config/hypr/scripts/ring.sh pct mem
    color = $color7
    font_size = 22
    font_family = lcd phone
    position = 0, 114
    halign = center
    valign = bottom
}
label {
    monitor =
    text = cmd[update:10000] $HOME/.config/hypr/scripts/ring.sh pct bat
    color = $color7
    font_size = 22
    font_family = lcd phone
    position = 150, 114
    halign = center
    valign = bottom
}

# ring captions
label {
    monitor =
    text = CPU
    color = rgba(ffffff99)
    font_size = 12
    font_family = lcd phone
    position = -150, 40
    halign = center
    valign = bottom
}
label {
    monitor =
    text = MEM
    color = rgba(ffffff99)
    font_size = 12
    font_family = lcd phone
    position = 0, 40
    halign = center
    valign = bottom
}
label {
    monitor =
    text = cmd[update:10000] $HOME/.config/hypr/scripts/ring.sh cap bat
    color = rgba(ffffff99)
    font_size = 12
    font_family = lcd phone
    position = 150, 40
    halign = center
    valign = bottom
}

# ── BOTTOM CORNERS ───────────────────────────────────
label {
    monitor =
    text = cmd[update:60000] $HOME/.config/hypr/scripts/hl.py uptime
    color = $color7
    font_size = 14
    font_family = lcd phone
    position = 40, 40
    halign = left
    valign = bottom
}
label {
    monitor =
    text = cmd[update:5000] $HOME/.config/hypr/scripts/hl.py windows
    color = $color7
    font_size = 14
    font_family = lcd phone
    position = -40, 40
    halign = right
    valign = bottom
}
