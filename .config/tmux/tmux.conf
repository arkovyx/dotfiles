unbind C-b
set -g prefix M-a
bind M-a send-prefix

# Alt+V = vertical split (V for Vertical!)
bind -n M-v split-window -h

# Alt+H = horizontal split (H for Horizontal!)
bind -n M-h split-window -v

# -------- RESIZING (Alt + Shift + hjkl) --------
bind -n M-H resize-pane -L 5
bind -n M-J resize-pane -D 5
bind -n M-K resize-pane -U 5
bind -n M-L resize-pane -R 5

# -------- CYCLE PANES (Alt+Tab like Windows!) --------
bind -n M-Tab select-pane -t :.+

# -------- WINDOWS --------
# Alt+N = new window
bind -n M-n new-window -c "#{pane_current_path}"

# Alt+R = rename window
bind -n M-r command-prompt -I "#W" "rename-window '%%'"

# Alt+1-9 = switch to window
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n M-0 select-window -t 10

# -------- CLOSE STUFF --------
# Alt+Q = close pane (like quitting)
bind -n M-q confirm-before -p "Kill pane #P? (y/n)" kill-pane

# Alt+Shift+Q = close window
bind -n M-Q confirm-before -p "Kill window #W? (y/n)" kill-window

# -------- EXTRA USEFUL --------
# Alt+Z = zoom pane
bind -n M-z resize-pane -Z

# Alt+D = detach
bind -n M-d detach-client

# Alt+Space = last window
bind -n M-Space last-window

# Alt+? = show all keybindings (help)
bind -n M-? list-keys

# -------- RELOAD CONFIG --------
bind -n C-M-r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# -------- MOUSE SUPPORT --------
set -g mouse on
set -g focus-events on

# -------- VISUAL STUFF (keep your theme) --------
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB"
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 0
set -g history-limit 50000
setw -g mode-keys vi

set -g window-style 'bg=default'
set -g window-active-style 'bg=default'
set -g pane-border-style 'bg=default,fg=#7a7977'
set -g pane-active-border-style 'bg=default,fg=#e4e1db'

# -------- STATUS BAR --------
set -g status-position bottom
set -g status-style 'bg=default,fg=#c8c5c1'
set -g status-left-length 40
set -g status-right-length 40
set -g status-left '#[fg=#c8c5c1]   #S  │ '
set -g status-right ''
setw -g window-status-format '#[fg=#a9a7a2]   #I:#W '
setw -g window-status-current-format '#[fg=#e4e1db,bold]   #I:#W '
setw -g window-status-separator ''
set -g message-style 'bg=default,fg=#d0ccc7,bold'
set -g message-command-style 'bg=default,fg=#d0ccc7'
setw -g monitor-activity off
set -g visual-activity off
setw -g clock-mode-colour '#5fff5f'
